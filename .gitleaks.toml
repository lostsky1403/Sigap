# Gitleaks configuration.
#
# PURPOSE: one narrowly-scoped allowlist for a FALSE POSITIVE that is already in this
# branch's history. Nothing else about secret detection changes — `useDefault = true`
# keeps the full built-in rule set, and the allowlist below is deliberately the narrowest
# form the schema supports.
#
# WHAT HAPPENED. `scripts/ops/test-restore-contract.sh` carried a synthetic 64-hex test
# constant written as `API=43fcbcb3...`. The `generic-api-key` rule flags that shape on
# entropy (3.86), and gitleaks scans the pull request's COMMIT RANGE, so it reports the
# finding against the commit that introduced it (9e0d61a) even though the constant has
# since been replaced with a low-entropy placeholder (`API=aaaa...`). The finding is
# therefore historical: the current file is clean, and a scan of the working tree finds
# nothing.
#
# WHY AN ALLOWLIST RATHER THAN A REVERT. The offending commit is already pushed, and
# rewriting published history is not an option — it would also invalidate the run
# evidence this branch exists to produce. The constant itself was fixed in 04c5628; this
# entry only silences the stale finding in the range scan.
#
# WHY THE RULE-SPECIFIC FORM. The global `[[allowlists]]` table and its `targetRules`
# field were introduced in gitleaks 8.25.0. CI runs 8.24.3, where that table is not
# recognised and is silently ignored — verified by reproducing the failure locally with
# the exact CI version. `[[rules.allowlists]]` has been supported since 8.21.0 and works
# on both, so the scoping is expressed as a rule-specific allowlist instead.
#
# WHY THIS IS NOT A WEAKENING. Every criterion must match (`condition = "AND"`), and the
# rule is named by id:
#   * the rule       — only `generic-api-key`; every other rule still applies;
#   * commits        — only the single historical commit that introduced the constant;
#   * paths          — only the one test file;
#   * regexes        — only that exact string, matched against the whole finding text.
#     `regexTarget = "match"` tests the regexes against the finding's FULL MATCH, not against
#     the captured secret (that would be the default, `"secret"`) and not against the
#     containing line (`"line"`). Named explicitly so the intent is not left to the default.
# A genuine secret added to this file in any other commit is still detected, as is
# anything matching any other rule anywhere. There is no path-wide or rule-wide blanket.
#
# REMOVAL: this entry can be deleted once the branch is squash-merged, because the merged
# content contains the placeholder and the historical commit disappears from the log.

[extend]
useDefault = true

# Extends the default `generic-api-key` rule; all its other attributes are inherited.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Synthetic 64-hex fixture constant in a test file; false positive in one historical commit (see the header of this file)"
  condition = "AND"
  commits = ["9e0d61a234341caf77a5383fa08d2f60d77885b3"]
  paths = ['''scripts/ops/test-restore-contract\.sh''']
  regexTarget = "match"
  regexes = ['''43fcbcb35ed276b33327fa4d9ad8d9d909de6875cde185e2360bbc7374794c8f''']
