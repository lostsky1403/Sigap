# docker-compose.prod-ports.yml
# Production port override for shared VPS hosts.
# Host port 8080 is commonly taken by unrelated apps (do NOT stop them).
# This override keeps container port 8080 and publishes Sigap API on host 18080.
# Backend ports bind loopback only so Postgres/engine/API are not publicly
# reachable; web stays public until HTTPS reverse-proxy termination is proven,
# then it will also move behind the proxy. Internal service URLs unchanged.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod-ports.yml up -d --build
services:
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"
  rust-engine:
    ports: !override
      - "127.0.0.1:50051:50051"
  api:
    ports: !override
      - "127.0.0.1:18080:8080"
    # Fail closed: the base file defaults SIGAP_ENV to "local" for development.
    # The production overlay REQUIRES an explicit value instead. Compose refuses
    # to interpolate (before any container starts) when it is unset or empty.
    # A value of "local" is rejected separately by scripts/ops/preflight-production-env.sh.
    environment:
      SIGAP_ENV: ${SIGAP_ENV:?SIGAP_ENV must be set explicitly for the production overlay (e.g. SIGAP_ENV=staging); refusing to default to "local"}
  web:
    # Same fail-closed requirement as api (base defaults this to "local").
    environment:
      SIGAP_ENV: ${SIGAP_ENV:?SIGAP_ENV must be set explicitly for the production overlay (e.g. SIGAP_ENV=staging); refusing to default to "local"}
