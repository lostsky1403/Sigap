name: r2-offhost-backup

# ACTIVATION — why this is not `workflow_dispatch`-only.
#
# `workflow_dispatch` requires the workflow file to be REGISTERED ON THE DEFAULT BRANCH.
# A dispatch-only workflow committed to `design/ui-ux-overhaul` is therefore inert: no
# entry appears in the Actions UI and no run can be started. Activating testing must not
# require merging to `main`, so the working trigger is `pull_request`.
#
# GitHub evaluates `pull_request` workflows from the pull request's own merge ref, so a
# workflow committed on `design/ui-ux-overhaul` runs for a PR whose BASE is that branch.
# This is the procedure already proven by the SIGAP-88 validation run
# (`.github/workflows/ops-sandbox.yml`, run 38163833629).
#
# It is opt-in twice over, so it cannot fire by accident:
#   1. the `paths` filter means it runs only when a file it actually exercises changes;
#   2. the job-level `if` requires the `r2-validation` label, which only the owner applies.
# A PR without that label runs nothing at all.
#
# PREREQUISITE — the label does not exist yet. As of the current repository state
# `r2-validation` has never been created, so the gate cannot be satisfied and the job is
# skipped for every PR. Create it once (owner):
#   gh label create r2-validation --repo lostsky1403/Sigap \
#     --description "Owner approval to run the R2 off-host round trip" --color FBCA04
# See runbook §13g.11 for the full activation procedure and the bounded scope of what a run
# proves.
#
# `workflow_dispatch` is retained for the future case where this file reaches the default
# branch; it is NOT required for testing and merging to `main` is explicitly NOT a
# prerequisite.
on:
  pull_request:
    branches: [design/ui-ux-overhaul]
    paths:
      - '.github/workflows/r2-offhost-backup.yml'
      - 'scripts/ops/sigap-archive-restore.sh'
      - 'scripts/ops/test-restore-contract.sh'
      - 'scripts/ops/ops-sandbox.sh'
      - 'docs/operations/DEPLOYMENT_RUNBOOK.md'
  workflow_dispatch:
    inputs:
      confirm_manual_run:
        description: 'Type RUN to confirm you intend to execute the R2 round-trip'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  r2-round-trip:
    name: R2 off-host round trip (disposable MinIO + throwaway age key)
    # The label gate. Without `r2-validation` on the PR this job is skipped, which is the
    # explicit owner opt-in. For a manual dispatch the input guard below applies instead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'r2-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A DISPOSABLE endpoint. `minioadmin` is the well-known default for a throwaway
      # container and is NOT a secret. No real R2 credential appears anywhere in this file,
      # and none is ever read from repository secrets.
      R2_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: sigap-backup-test
      STAMP: '20260101T000000Z'
      # The isolated daemon is reached over LOOPBACK, because it runs as a container on the
      # same runner. The helper refuses loopback by default, so the opt-in is explicit and
      # narrow: it does NOT relax the engine-ID allowlist or the ambient-distinctness check.
      SIGAP_ALLOW_LOOPBACK_TARGET: '1'
    steps:
      - name: Guard — explicit opt-in
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm_manual_run }}" != "RUN" ]; then
              echo "Refusing to run: dispatch this workflow with confirm_manual_run=RUN."
              exit 1
            fi
          else
            echo "Opt-in satisfied by the 'r2-validation' label on PR #${{ github.event.pull_request.number }}."
          fi

      - uses: actions/checkout@v4

      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      - name: Start disposable MinIO
        run: |
          set -euo pipefail
          # Bound to LOOPBACK ONLY. `-p 9000:9000` would publish the endpoint on every
          # runner interface; `-p 127.0.0.1:9000:9000` exposes it to this host alone.
          docker run -d --name sigap-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: minio did not become ready"; docker logs sigap-minio; exit 1

      - name: Create the disposable bucket
        run: |
          set -euo pipefail
          aws s3api create-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT"
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT"

      - name: Generate a throwaway age key pair
        run: |
          set -euo pipefail
          # A DISPOSABLE key. Generated here, used here, destroyed with the runner. It is
          # never a production key, is never read from a secret, and never leaves this job.
          umask 077
          age-keygen -o "$RUNNER_TEMP/throwaway.key" 2>"$RUNNER_TEMP/keygen.err"
          RECIP=$(age-keygen -y "$RUNNER_TEMP/throwaway.key")
          echo "::add-mask::$RECIP"
          echo "RECIP=$RECIP" >> "$GITHUB_ENV"
          # Correspondence is proven WITHOUT printing the private key: `age-keygen -y`
          # emits public material only (runbook §13h.3).
          test -n "$RECIP"

      - name: Build a synthetic dummy image
        run: |
          set -euo pipefail
          # Synthetic content only. No production image, no production data, no secret.
          mkdir -p "$RUNNER_TEMP/ctx"
          printf 'FROM scratch\nCOPY marker.txt /marker.txt\n' > "$RUNNER_TEMP/ctx/Dockerfile"
          printf 'sigap-r2-drill\n' > "$RUNNER_TEMP/ctx/marker.txt"
          docker build -q -t sigap-r2-drill:local "$RUNNER_TEMP/ctx"
          # `docker inspect --format '{{.Id}}'` yields the `sha256:<digest>` form. The helper
          # normalises it, so either spelling would work; it is passed as produced, which is
          # exactly what a real operator would paste.
          API_ID=$(docker inspect --format '{{.Id}}' sigap-r2-drill:local)
          echo "dummy image id: $API_ID"
          echo "API_ID=$API_ID" >> "$GITHUB_ENV"

      - name: Preserve — save, compress, encrypt off-host, upload, read back
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          KEY="$RUNNER_TEMP/throwaway.key"
          ST=$(mktemp -d)

          # Per-stage status. A plain POSIX pipeline reports ONLY the last command's
          # status, so `docker image save <bad-id> | gzip -1` exits 0 and leaves a 20-byte
          # artifact that PASSES `gzip -t` — gzip of empty input is valid gzip. PIPESTATUS
          # is read ONCE as an array; reading it twice resets it.
          set +e
          set -o pipefail
          docker image save "$API_ID" | gzip -1 | age -r "$RECIP" > "$ST/$ART"
          ps=("${PIPESTATUS[@]}")
          set +o pipefail
          set -e
          r_save=${ps[0]:-1}; r_gzip=${ps[1]:-1}; r_age=${ps[2]:-1}
          echo "stream stages: save=$r_save gzip=$r_gzip age=$r_age"
          [ "$r_save" -eq 0 ] || { echo "FAIL: docker image save failed"; exit 1; }
          [ "$r_gzip" -eq 0 ] || { echo "FAIL: gzip failed"; exit 1; }
          [ "$r_age"  -eq 0 ] || { echo "FAIL: age encrypt failed"; exit 1; }

          # The artifact is age CIPHERTEXT, so `gzip -t` on it would exit 1 and abort a
          # SUCCESSFUL run. Assert the age header magic instead.
          head -c 30 "$ST/$ART" | grep -q 'age-encryption.org/v1' \
            || { echo "FAIL: artifact is not an age file"; exit 1; }
          [ -s "$ST/$ART" ] || { echo "FAIL: artifact is empty"; exit 1; }

          DIGEST=$(sha256sum "$ST/$ART" | cut -d' ' -f1)
          echo "digest: $DIGEST"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

          aws s3api put-object --bucket "$R2_BUCKET" --key "sigap/$ART" \
            --body "$ST/$ART" --endpoint-url "$R2_ENDPOINT" >/dev/null

          # READ-BACK. A zero exit from the upload is not proof the object is correct:
          # verify the recorded length AND that a download reproduces the digest.
          REMOTE_LEN=$(aws s3api head-object --bucket "$R2_BUCKET" --key "sigap/$ART" \
            --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)
          LOCAL_LEN=$(wc -c < "$ST/$ART" | tr -d ' ')
          [ "$REMOTE_LEN" = "$LOCAL_LEN" ] \
            || { echo "FAIL: read-back length mismatch (r2=$REMOTE_LEN local=$LOCAL_LEN)"; exit 1; }
          READBACK=$(aws s3 cp "s3://$R2_BUCKET/sigap/$ART" - \
            --endpoint-url "$R2_ENDPOINT" | sha256sum | cut -d' ' -f1)
          [ "$READBACK" = "$DIGEST" ] \
            || { echo "FAIL: read-back digest mismatch — the object is NOT the artifact"; exit 1; }
          echo "ok: uploaded and read back byte-identical ($LOCAL_LEN bytes)"

      - name: Start the isolated restore daemon (loopback only)
        run: |
          set -euo pipefail
          # A second, isolated daemon for the restore target. The helper proves isolation by
          # ENGINE IDENTITY, so this must be a genuinely distinct engine — which it is,
          # because it is a separate `dockerd` inside this container.
          #
          # PORT BINDING: `-p 127.0.0.1:2375:2375`, NOT `-p 2375:2375`. Publishing on all
          # interfaces would expose an unauthenticated Docker API to the runner's network,
          # and a privileged daemon reachable that way is a host-compromise primitive.
          #
          # NO DOCKER SOCKET IS MOUNTED. `/var/run/docker.sock` is deliberately absent from
          # every `docker run` in this workflow, so neither container can drive the runner's
          # own daemon.
          docker run -d --name sigap-restore-dind --privileged \
            -e DOCKER_TLS_CERTDIR= \
            -p 127.0.0.1:2375:2375 docker:dind >/dev/null
          for i in $(seq 1 90); do
            if docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; then
              echo "isolated daemon ready after ${i}s"; break
            fi
            sleep 1
          done
          ISOLATED_ID=$(docker -H tcp://127.0.0.1:2375 info --format '{{.ID}}')
          [ -n "$ISOLATED_ID" ] || { echo "FAIL: no engine id from the isolated daemon"; exit 1; }
          # Each `run` step is a separate shell, so the engine id must be persisted for the
          # negative-control steps below. A bare shell variable would be empty there and the
          # helper would refuse with rc=10, making those controls pass for the wrong reason.
          echo "ISOLATED_ID=$ISOLATED_ID" >> "$GITHUB_ENV"
          echo "isolated engine: $ISOLATED_ID"

      - name: Restore — retrieve from R2 through the real helper
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$API_ID" \
            bash scripts/ops/sigap-archive-restore.sh

          # Independent confirmation on the isolated daemon, scoped to the one ID this job
          # produced. A daemon-wide listing would prove nothing about the artifact.
          docker -H tcp://127.0.0.1:2375 image inspect "$API_ID" >/dev/null \
            || { echo "FAIL: the restored image is absent on the isolated daemon"; exit 1; }
          echo "ok: restored image ID matches the preserved ID on the isolated daemon"

      - name: Negative control A — a substituted object must be refused
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          # GROUP A — OBJECT INTEGRITY. These cases prove the digest and URI guards, and
          # nothing about Cloudflare retention. The refusal is only meaningful because the
          # positive path above succeeded first.
          #
          # This overwrites the object in the DISPOSABLE MinIO bucket. That is safe here and
          # is NOT a pattern for the real bucket: on R2 a protected backup object must never
          # be overwritten to test retention (see the note at the end of this file).
          printf 'not-the-artifact' > "$RUNNER_TEMP/wrong.bin"
          aws s3api put-object --bucket "$R2_BUCKET" --key "sigap/$ART" \
            --body "$RUNNER_TEMP/wrong.bin" --endpoint-url "$R2_ENDPOINT" >/dev/null
          set +e
          ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$API_ID" \
            bash scripts/ops/sigap-archive-restore.sh >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 12 ] || { echo "FAIL: substituted object returned $rc, expected 12 (digest mismatch)"; exit 1; }
          echo "ok: substituted object refused with rc=12"

      - name: Negative control A2 — a URI naming another release must be refused
        run: |
          set -euo pipefail
          set +e
          ARCHIVE_URI="r2://$R2_BUCKET/sigap/sigap-pre-redesign-19990101T000000Z.tar.gz.age" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$API_ID" \
            bash scripts/ops/sigap-archive-restore.sh >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 10 ] || { echo "FAIL: wrong-release URI returned $rc, expected 10"; exit 1; }
          echo "ok: wrong-release URI refused with rc=10"

      - name: Negative control A3 — a malformed image ID must be refused as input
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          # A doubled prefix is the exact shape the earlier unconditional prefixing produced.
          set +e
          ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="sha256:sha256:$API_ID" \
            bash scripts/ops/sigap-archive-restore.sh >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 10 ] || { echo "FAIL: doubled-prefix ID returned $rc, expected 10 (malformed input)"; exit 1; }
          echo "ok: doubled-prefix image ID refused with rc=10"

      - name: Negative control A4 — a loopback target without the opt-in must be refused
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          set +e
          env -u SIGAP_ALLOW_LOOPBACK_TARGET \
          ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$API_ID" \
            bash scripts/ops/sigap-archive-restore.sh >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 11 ] || { echo "FAIL: loopback without opt-in returned $rc, expected 11"; exit 1; }
          echo "ok: loopback target refused without SIGAP_ALLOW_LOOPBACK_TARGET=1"

      # ---------------------------------------------------------------------------------
      # GROUP B — CLOUDFLARE RETENTION-POLICY BEHAVIOUR. NOT COVERED BY THIS WORKFLOW.
      #
      # MinIO is S3-compatible; it does NOT implement R2 Bucket Lock. Nothing in this job
      # therefore says anything about whether an R2 lock rule prevents deletion or
      # overwriting. Group A proves object integrity and input/URI guards only.
      #
      # Verifying Bucket Lock requires the real service and a future, separately authorized
      # test: create a DISPOSABLE object under a throwaway prefix, apply a short retention
      # rule, and assert that deletion is refused for the window. That test must NEVER
      # attempt to delete or overwrite a real protected backup object — the attempt is
      # itself the destructive action the rule exists to prevent, and a bucket cannot be
      # emptied while lock rules are configured.
      # ---------------------------------------------------------------------------------

      - name: Cleanup
        if: always()
        run: |
          docker rm -f sigap-minio sigap-restore-dind 2>/dev/null || true
          rm -f "$RUNNER_TEMP/throwaway.key" 2>/dev/null || true
          echo "disposable endpoint, daemon and throwaway key destroyed with the runner"
