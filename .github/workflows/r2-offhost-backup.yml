name: r2-offhost-backup

# ACTIVATION — why this is not `workflow_dispatch`-only.
#
# `workflow_dispatch` requires the workflow file to be REGISTERED ON THE DEFAULT BRANCH.
# A dispatch-only workflow committed to `design/ui-ux-overhaul` is therefore inert: no
# entry appears in the Actions UI and no run can be started. Activating testing must not
# require merging to `main`, so the working trigger is `pull_request`.
#
# GitHub evaluates `pull_request` workflows from the pull request's own merge ref, so a
# workflow committed on `design/ui-ux-overhaul` runs for a PR whose BASE is that branch.
# This is the procedure already proven by the SIGAP-88 validation run
# (`.github/workflows/ops-sandbox.yml`, run 38163833629).
#
# It is opt-in twice over, so it cannot fire by accident:
#   1. the `paths` filter means it runs only when a file it actually exercises changes;
#   2. the job-level `if` requires the `r2-validation` label, which only the owner applies.
# A PR without that label runs the job zero times — see the ACTIVITY TYPES note below, which
# is the second half of the gate and was previously missing.
#
# PREREQUISITE — the label must EXIST. `r2-validation` is not a default GitHub label; until
# it is created the `if` can never be satisfied and the job is skipped for every PR. Create
# it once (owner):
#   gh label create r2-validation --repo lostsky1403/Sigap \
#     --description "Owner approval to run the R2 off-host round trip" --color FBCA04
# See runbook §13g.11 for the full activation procedure and the bounded scope of what a run
# proves.
#
# `workflow_dispatch` is retained for the future case where this file reaches the default
# branch; it is NOT required for testing and merging to `main` is explicitly NOT a
# prerequisite.
on:
  pull_request:
    # ACTIVITY TYPES — required, and the reason the gate was unreachable.
    #
    # GitHub's DEFAULT activity types for `pull_request` are `opened`, `synchronize` and
    # `reopened` ONLY. `labeled` is NOT among them. A run therefore starts when the PR is
    # opened (without the label, so the job-level `if` skips it) and never starts again when
    # the owner applies `r2-validation` — the label event produces no run at all, so the
    # job's `if` is never evaluated and the gate can never open. The gate read as present
    # while being structurally unreachable, which is the same shape as the fail-open
    # defects corrected in the helper.
    #
    # `labeled` is therefore listed explicitly. `opened`/`synchronize`/`reopened` are kept
    # because a PR that carries the label already must re-run when new commits arrive —
    # without `synchronize` a fix pushed to an approved PR would never be re-tested.
    #
    # `pull_request_target` is deliberately NOT used: it runs in the base repository's
    # context with a writable token and access to secrets, which would hand this job
    # privileges it does not need. `pull_request` gives a read-only token and no secrets,
    # which is the correct posture for a job that talks only to a disposable local MinIO.
    types: [opened, synchronize, reopened, labeled]
    branches: [design/ui-ux-overhaul]
    paths:
      - '.github/workflows/r2-offhost-backup.yml'
      - 'scripts/ops/sigap-archive-restore.sh'
      - 'scripts/ops/test-restore-contract.sh'
      - 'scripts/ops/ops-sandbox.sh'
      - 'docs/operations/DEPLOYMENT_RUNBOOK.md'
  workflow_dispatch:
    inputs:
      confirm_manual_run:
        description: 'Type RUN to confirm you intend to execute the R2 round-trip'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  r2-round-trip:
    name: R2 off-host round trip (disposable MinIO + throwaway age key)
    # The label gate. Without `r2-validation` on the PR this job is skipped, which is the
    # explicit owner opt-in. For a manual dispatch the input guard below applies instead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'r2-validation')
    runs-on: ubuntu-latest
    # 25 minutes was budgeted for pulling a small image. The MinIO image is now BUILT from
    # upstream source in a separate step, which is a network-clone plus a `go build` of a
    # large module — minutes, not seconds. 40 minutes leaves the round trip itself the same
    # budget it always had, with the build given room it did not need before.
    timeout-minutes: 40
    env:
      # A DISPOSABLE endpoint. `minioadmin` is the well-known default for a throwaway
      # container and is NOT a secret. No real R2 credential appears anywhere in this file,
      # and none is ever read from repository secrets.
      R2_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: sigap-backup-test
      STAMP: '20260101T000000Z'
      # The isolated daemon is reached over LOOPBACK, because it runs as a container on the
      # same runner. The helper refuses loopback by default, so the opt-in is explicit and
      # narrow: it does NOT relax the engine-ID allowlist or the ambient-distinctness check.
      SIGAP_ALLOW_LOOPBACK_TARGET: '1'
    steps:
      - name: Guard — explicit opt-in
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm_manual_run }}" != "RUN" ]; then
              echo "Refusing to run: dispatch this workflow with confirm_manual_run=RUN."
              exit 1
            fi
          else
            echo "Opt-in satisfied by the 'r2-validation' label on PR #${{ github.event.pull_request.number }}."
          fi

      - uses: actions/checkout@v4

      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      - name: Build the disposable MinIO image from pinned upstream source
        run: |
          set -euo pipefail
          # WHY BUILD RATHER THAN PULL: `minio/minio` no longer exists as a published image.
          # The upstream repository was archived on 2026-04-25 and its README states the
          # community edition is "distributed as source code only. We will no longer provide
          # pre-compiled binary releases". The Docker Hub repo is ARCHIVED, and the release
          # download endpoints return HTTP 410 Gone.
          #
          # Neither upstream Dockerfile can be used as-is:
          #   * Dockerfile            — `FROM minio/minio:latest`, i.e. it needs the SAME
          #                            archived image, so it fails immediately.
          #                          [OBSERVED] run 38220464666 step "Start disposable MinIO"
          #                          exit 125 pulling `minio/minio:latest`; run 38223688099
          #                          step "Build the disposable MinIO image" exit 1 with
          #                          `failed to resolve source metadata for
          #                          docker.io/minio/minio:latest ... insufficient_scope`.
          #   * Dockerfile.release    — downloads the pre-built binary from dl.min.io, which
          #                            now returns HTTP 410 Gone.
          # So the binary is COMPILED from source and placed in a small image. That is the
          # documented upstream path ("Install from source using go install
          # github.com/minio/minio@latest"), and the module resolves from the Go proxy.
          #
          # The ref is the last upstream security release, which fixes the service-account
          # policy-bypass CVE (GHSA-jjjj-jwhf-8rgr). A PSEUDO-VERSION is used rather than the
          # tag name because `go install` resolves tags only when the module proxy publishes
          # one; the pseudo-version is the tag's own commit (9e49d5e7a648, the detached-HEAD
          # commit the cloned tag produced) and is stable for as long as that commit exists.
          # `@latest` is deliberately NOT used: it would make the result of this test a
          # function of upstream state on the day it happens to run.
          MINIO_REF=v0.0.0-20251015172955-9e49d5e7a648
          BUILD=$(mktemp -d)
          # A Pinned compile, in a layer the runner can discard. CGO is off so the result is
          # a static binary that runs in any Linux image. `go install` writes to GOBIN.
          # shellcheck disable=SC2016  # `$MINIO_REF` IS expanded — by the shell, before go
          # sees it. Go's own module syntax uses `@version`, so shellcheck reads the single
          # quotes as an intentional literal. The quoting is required so the `@` is not
          # misparsed; the warning is a false positive, not a defect.
          GOBIN="$BUILD/bin" CGO_ENABLED=0 \
            go install "github.com/minio/minio@$MINIO_REF"
          # `go install` prints nothing on success, so assert the BINARY is there AND that it
          # is an ELF executable for linux/amd64. A silently empty GOBIN would otherwise
          # produce an image that starts and immediately exits, and the failure would surface
          # as "minio did not become ready" — the right symptom for the wrong cause.
          MINIO_BIN="$BUILD/bin/minio"
          [ -x "$MINIO_BIN" ] || { echo "FAIL: go install produced no minio binary"; exit 1; }
          file "$MINIO_BIN" | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "FAIL: minio is not a linux/amd64 ELF binary"; file "$MINIO_BIN"; exit 1; }
          # The health endpoint the round trip depends on, proved before the image is built.
          #
          # NO SHELL WRAPPER. An earlier revision copied a `#!/bin/sh` entrypoint into a
          # `FROM scratch` image, which cannot work: `scratch` has no `/bin/sh`, so the
          # kernel cannot resolve the shebang and reports ENOENT — surfacing as
          #   exec /usr/bin/docker-entrypoint.sh: no such file or directory
          # which reads as a missing SCRIPT when the file is present and the INTERPRETER is
          # what is missing. [OBSERVED] run 38228084236, step "Start disposable MinIO".
          #
          # Upstream's entrypoint only exists to prepend `minio` when the first argument is
          # not already the subcommand. Making the BINARY the entrypoint achieves the same
          # thing with no interpreter at all: the workflow passes `server /data`, so the
          # process is `/usr/bin/minio server /data`.
          printf 'FROM scratch\nCOPY minio /usr/bin/minio\nEXPOSE 9000\nVOLUME ["/data"]\nENTRYPOINT ["/usr/bin/minio"]\nCMD ["server", "/data"]\n' > "$BUILD/Dockerfile"
          cp "$MINIO_BIN" "$BUILD/minio"
          docker build -q -t sigap-minio:local "$BUILD" >/dev/null
          rm -rf "$BUILD"
          # Assert the IMAGE exists, not just the build's exit code.
          docker image inspect sigap-minio:local >/dev/null \
            || { echo "FAIL: the built MinIO image is absent"; exit 1; }
          # And assert the entrypoint RESOLVES, which is the failure that cost a run: a
          # `FROM scratch` image with no interpreter starts and dies with a misleading ENOENT.
          # `--version` overrides CMD, so this executes `/usr/bin/minio --version` through the
          # real ENTRYPOINT — the same exec path the server will use.
          docker run --rm sigap-minio:local --version | grep -q 'minio' \
            || { echo "FAIL: the built image cannot execute its entrypoint"; exit 1; }
          echo "disposable MinIO built from upstream $MINIO_REF"

      - name: Start disposable MinIO
        run: |
          set -euo pipefail
          # Bound to LOOPBACK ONLY. `-p 9000:9000` would publish the endpoint on every
          # runner interface; `-p 127.0.0.1:9000:9000` exposes it to this host alone.
          docker run -d --name sigap-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            sigap-minio:local server /data
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: minio did not become ready"; docker logs sigap-minio; exit 1

      - name: Create the disposable bucket
        run: |
          set -euo pipefail
          # The image is built in a SEPARATE step above, so this one is a pure bucket setup.
          # A transient container-scheduling delay does not consume the timeout budget of the
          # round trip itself, and `--wait` avoids a race where the endpoint answers before
          # the S3 API is ready.
          for i in $(seq 1 30); do
            if aws s3api create-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" \
                 >/dev/null 2>&1; then
              echo "bucket ready after ${i} attempt(s)"; break
            fi
            sleep 1
          done
          # Assert rather than trust: without this, a bucket that never formed would make the
          # upload fail later as an opaque S3 error instead of the real cause.
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT"

      - name: Generate a throwaway age key pair
        run: |
          set -euo pipefail
          # A DISPOSABLE key. Generated here, used here, destroyed with the runner. It is
          # never a production key, is never read from a secret, and never leaves this job.
          umask 077
          age-keygen -o "$RUNNER_TEMP/throwaway.key" 2>"$RUNNER_TEMP/keygen.err"
          RECIP=$(age-keygen -y "$RUNNER_TEMP/throwaway.key")
          echo "::add-mask::$RECIP"
          echo "RECIP=$RECIP" >> "$GITHUB_ENV"
          # Correspondence is proven WITHOUT printing the private key: `age-keygen -y`
          # emits public material only (runbook §13h.3).
          test -n "$RECIP"

      - name: Build a synthetic dummy image
        run: |
          set -euo pipefail
          # Synthetic content only. No production image, no production data, no secret.
          mkdir -p "$RUNNER_TEMP/ctx"
          printf 'FROM scratch\nCOPY marker.txt /marker.txt\n' > "$RUNNER_TEMP/ctx/Dockerfile"
          printf 'sigap-r2-drill\n' > "$RUNNER_TEMP/ctx/marker.txt"
          docker build -q -t sigap-r2-drill:local "$RUNNER_TEMP/ctx"
          # `docker inspect --format '{{.Id}}'` yields the `sha256:<digest>` form. Kept as the
          # ID of the BUILT image; note that the expected RESTORED ID is taken from the
          # archive in the next step, which is what an operator restoring it actually gets.
          API_ID=$(docker inspect --format '{{.Id}}' sigap-r2-drill:local)
          echo "dummy image id: $API_ID"
          echo "API_ID=$API_ID" >> "$GITHUB_ENV"

      - name: Preserve — save, compress, encrypt off-host, upload, read back
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          ST=$(mktemp -d)

          # The tar is the artifact's payload. It is kept in $RUNNER_TEMP because each `run`
          # step is a separate shell and the out-of-band record is established in a LATER
          # step, on the ISOLATED daemon.
          #
          # WHY NOT RECORD THE ID HERE: `docker inspect` on the built image reports a config
          # digest, and `docker load` assigns the ID from what the tar carries — the two
          # differ ([OBSERVED] run 38272620285: inspect ff59b31e..., load d88c5ca4...). Worse,
          # loading the tar on a daemon that ALREADY holds the image reports that pre-existing
          # ID rather than the ID a clean load produces ([OBSERVED] run 38276467207: runner
          # load c1d7f34b..., isolated load 864c7a42... for the SAME bytes). A record taken
          # here would therefore never match the isolated daemon's load, and the drill would
          # fail for a reason that has nothing to do with the archive.
          docker image save "$API_ID" -o "$RUNNER_TEMP/image.tar"
          [ -s "$RUNNER_TEMP/image.tar" ] \
            || { echo "FAIL: docker image save produced no tar"; exit 1; }

          # Per-stage status. A plain POSIX pipeline reports ONLY the last command's
          # status, so `docker image save <bad-id> | gzip -1` exits 0 and leaves a 20-byte
          # artifact that PASSES `gzip -t` — gzip of empty input is valid gzip. PIPESTATUS
          # is read ONCE as an array; reading it twice resets it.
          # The tar produced above is the SAME bytes that get archived, so the recorded
          # expected ID and the artifact describe one artifact. The save stage is now the
          # `-o` file write above, whose status is checked directly; gzip and age are piped
          # from that file, each judged on its own exit so neither can mask the other — the
          # defect §7d.1 records, where `{ age | gzip; echo $? }` reported gzip's status and
          # a wrong key passed.
          set +e
          set -o pipefail
          gzip -1 -c "$RUNNER_TEMP/image.tar" | age -r "$RECIP" > "$ST/$ART"
          ps=("${PIPESTATUS[@]}")
          set +o pipefail
          set -e
          r_gzip=${ps[0]:-1}; r_age=${ps[1]:-1}
          echo "stream stages: gzip=$r_gzip age=$r_age"
          [ "$r_gzip" -eq 0 ] || { echo "FAIL: gzip failed"; exit 1; }
          [ "$r_age"  -eq 0 ] || { echo "FAIL: age encrypt failed"; exit 1; }

          # The artifact is age CIPHERTEXT, so `gzip -t` on it would exit 1 and abort a
          # SUCCESSFUL run. Assert the age header magic instead.
          head -c 30 "$ST/$ART" | grep -q 'age-encryption.org/v1' \
            || { echo "FAIL: artifact is not an age file"; exit 1; }
          [ -s "$ST/$ART" ] || { echo "FAIL: artifact is empty"; exit 1; }

          DIGEST=$(sha256sum "$ST/$ART" | cut -d' ' -f1)
          echo "digest: $DIGEST"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

          # The artifact is ALSO kept where later steps can reach it. `$RUNNER_TEMP` survives
          # across steps; `$ST` does not. Control A below deliberately overwrites the object
          # at this key to prove a substituted object is refused, and then restores the
          # original from here — without that, control A3 (which fetches this same key and
          # must reach the image-ID validator) would exit 12 on the digest check instead of
          # 10, and fail for a reason unrelated to the guard it tests.
          cp "$ST/$ART" "$RUNNER_TEMP/artifact.age"

          aws s3api put-object --bucket "$R2_BUCKET" --key "sigap/$ART" \
            --body "$ST/$ART" --endpoint-url "$R2_ENDPOINT" >/dev/null

          # READ-BACK. A zero exit from the upload is not proof the object is correct:
          # verify the recorded length AND that a download reproduces the digest.
          REMOTE_LEN=$(aws s3api head-object --bucket "$R2_BUCKET" --key "sigap/$ART" \
            --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)
          LOCAL_LEN=$(wc -c < "$ST/$ART" | tr -d ' ')
          [ "$REMOTE_LEN" = "$LOCAL_LEN" ] \
            || { echo "FAIL: read-back length mismatch (r2=$REMOTE_LEN local=$LOCAL_LEN)"; exit 1; }
          READBACK=$(aws s3 cp "s3://$R2_BUCKET/sigap/$ART" - \
            --endpoint-url "$R2_ENDPOINT" | sha256sum | cut -d' ' -f1)
          [ "$READBACK" = "$DIGEST" ] \
            || { echo "FAIL: read-back digest mismatch — the object is NOT the artifact"; exit 1; }
          echo "ok: uploaded and read back byte-identical ($LOCAL_LEN bytes)"

      - name: Start the isolated restore daemon (loopback only)
        run: |
          set -euo pipefail
          # A second, isolated daemon for the restore target. The helper proves isolation by
          # ENGINE IDENTITY, so this must be a genuinely distinct engine — which it is,
          # because it is a separate `dockerd` inside this container.
          #
          # PORT BINDING: `-p 127.0.0.1:2375:2375`, NOT `-p 2375:2375`. Publishing on all
          # interfaces would expose an unauthenticated Docker API to the runner's network,
          # and a privileged daemon reachable that way is a host-compromise primitive.
          #
          # NO DOCKER SOCKET IS MOUNTED. `/var/run/docker.sock` is deliberately absent from
          # every `docker run` in this workflow, so neither container can drive the runner's
          # own daemon.
          #
          # `docker:29-dind` is pinned, not `:latest`. The runner's own Docker version is
          # not something this workflow controls, so an unpinned nested daemon makes the
          # result of the test a function of upstream state on the day it runs. The tag was
          # verified to exist on Docker Hub before being used (the `dind` family has 144
          # published tags, including `29-dind`).
          docker run -d --name sigap-restore-dind --privileged \
            -e DOCKER_TLS_CERTDIR= \
            -p 127.0.0.1:2375:2375 docker:29-dind >/dev/null
          for i in $(seq 1 90); do
            if docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; then
              echo "isolated daemon ready after ${i}s"; break
            fi
            sleep 1
          done
          ISOLATED_ID=$(docker -H tcp://127.0.0.1:2375 info --format '{{.ID}}')
          [ -n "$ISOLATED_ID" ] || { echo "FAIL: no engine id from the isolated daemon"; exit 1; }

          # THE OUT-OF-BAND RECORD, established where it is meaningful: a load of the archive's
          # own bytes onto this CLEAN daemon. That is the identity an operator restoring the
          # archive would record, and the identity this same daemon will report when the
          # helper loads it — the load ID is content-derived, so the same bytes on the same
          # empty daemon give the same answer.
          #
          # The image is then REMOVED. Without that, the helper's correspondence check would
          # pass on an image that was already present, so a `docker load` that silently did
          # nothing would go undetected — the check would be satisfied by this step's own
          # load rather than by the restore under test.
          EXPECTED_IDS=$(docker -H tcp://127.0.0.1:2375 load < "$RUNNER_TEMP/image.tar" \
            | sed -n 's/^Loaded image ID:[[:space:]]*//p' | tail -1)
          [ -n "$EXPECTED_IDS" ] \
            || { echo "FAIL: the archive yielded no image ID on a clean daemon"; exit 1; }
          echo "out-of-band record (from a clean load of the archive): $EXPECTED_IDS"
          docker -H tcp://127.0.0.1:2375 rmi -f "${EXPECTED_IDS}" >/dev/null 2>&1 || true
          # Assert the removal actually happened, so the restore below is measured on an empty
          # daemon rather than on the record step's leftovers.
          if docker -H tcp://127.0.0.1:2375 image inspect "${EXPECTED_IDS}" >/dev/null 2>&1; then
            echo "FAIL: the record step's image is still present; the restore would not be independent"
            exit 1
          fi
          echo "EXPECTED_IDS=$EXPECTED_IDS" >> "$GITHUB_ENV"

          # NO DOCKER SOCKET — ASSERTED, not merely intended. The `docker run` calls pass no
          # `-v`, but the recipe is not evidence. A socket bind-mount would let either
          # container drive the runner's own daemon: a host-compromise primitive, and it
          # would also collapse the engine-distinctness proof the helper depends on. Inspect
          # the RUNNING containers so this fails if a mount is ever added.
          for c in sigap-minio sigap-restore-dind; do
            mounts=$(docker inspect --format '{{range .Mounts}}{{.Source}}{{"\n"}}{{end}}' "$c")
            if printf '%s' "$mounts" | grep -q 'docker\.sock'; then
              echo "FAIL: $c has a Docker socket mounted:"; printf '%s\n' "$mounts"; exit 1
            fi
          done
          # The disposable endpoint must not be privileged either. Only the nested daemon
          # needs that, and only because `dockerd` requires it to set up its own storage.
          priv=$(docker inspect --format '{{.HostConfig.Privileged}}' sigap-minio)
          [ "$priv" = "false" ] || { echo "FAIL: sigap-minio is privileged ($priv)"; exit 1; }
          echo "ok: no Docker socket mounted in either container; MinIO is not privileged"
          # Each `run` step is a separate shell, so the engine id must be persisted for the
          # negative-control steps below. A bare shell variable would be empty there and the
          # helper would refuse with rc=10, making those controls pass for the wrong reason.
          echo "ISOLATED_ID=$ISOLATED_ID" >> "$GITHUB_ENV"
          echo "isolated engine: $ISOLATED_ID"

      - name: Restore — retrieve from R2 through the real helper
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$EXPECTED_IDS" \
            bash scripts/ops/sigap-archive-restore.sh

          # Independent confirmation on the isolated daemon, scoped to the one ID this job
          # produced. A daemon-wide listing would prove nothing about the artifact, and a
          # bare `inspect >/dev/null` only proves SOME image exists under that name. Resolve
          # the ID and COMPARE it, so the assertion is the correspondence the runbook claims.
          # `docker image inspect` prints the `sha256:` form; compare on the bare digest.
          got=$(docker -H tcp://127.0.0.1:2375 image inspect --format '{{.Id}}' "sha256:${EXPECTED_IDS#sha256:}")
          want=${EXPECTED_IDS#sha256:}
          [ "${got#sha256:}" = "$want" ] \
            || { echo "FAIL: restored image ID $got != archived $EXPECTED_IDS"; exit 1; }
          echo "ok: restored image ID matches the preserved ID on the isolated daemon"

      - name: Negative control A — a substituted object must be refused
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          # GROUP A — OBJECT INTEGRITY. These cases prove the digest and URI guards, and
          # nothing about Cloudflare retention. The refusal is only meaningful because the
          # positive path above succeeded first.
          #
          # This overwrites the object in the DISPOSABLE MinIO bucket. That is safe here and
          # is NOT a pattern for the real bucket: on R2 a protected backup object must never
          # be overwritten to test retention (see the note at the end of this file).
          printf 'not-the-artifact' > "$RUNNER_TEMP/wrong.bin"
          aws s3api put-object --bucket "$R2_BUCKET" --key "sigap/$ART" \
            --body "$RUNNER_TEMP/wrong.bin" --endpoint-url "$R2_ENDPOINT" >/dev/null
          # PRECONDITION — the expected code must be reachable only via the guard under test.
          # Without this, an empty input (e.g. `$GITHUB_ENV` persistence failing) makes the
          # helper refuse with 10 for an unrelated reason and the control below would have to
          # be read as a pass. Assert the inputs exist before asserting the refusal.
          for v in DIGEST API_ID ISOLATED_ID; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v is empty — the control would pass for the wrong reason"; exit 1; }
          done
          set +e
          out=$(ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$EXPECTED_IDS" \
            bash scripts/ops/sigap-archive-restore.sh 2>&1)
          rc=$?
          set -e
          [ "$rc" -eq 12 ] || { echo "FAIL: substituted object returned $rc, expected 12 (digest mismatch)"; printf '%s\n' "$out"; exit 1; }
          # The CODE alone is not the proof. Assert the REASON: only the digest comparison
          # produces this message, so the control cannot be satisfied by an unrelated
          # refusal that happens to exit 12.
          printf '%s' "$out" | grep -q 'REFUSED: digest mismatch' \
            || { echo "FAIL: rc=12 for the WRONG reason — the digest guard did not fire"; printf '%s\n' "$out"; exit 1; }
          echo "ok: substituted object refused with rc=12 (digest mismatch)"

          # RESTORE the original object. Control A3 below fetches this same key, and its
          # guard (the image-ID validator) runs only AFTER a successful fetch, digest check,
          # decrypt, decompress and load. Leaving the tampered bytes in place would make A3
          # exit 12 on the digest check instead of 10, failing for a reason that has nothing
          # to do with the input validator it exists to exercise. Verified, not assumed:
          # a restore that silently did nothing would reintroduce exactly that failure.
          aws s3api put-object --bucket "$R2_BUCKET" --key "sigap/$ART" \
            --body "$RUNNER_TEMP/artifact.age" --endpoint-url "$R2_ENDPOINT" >/dev/null
          restored=$(aws s3 cp "s3://$R2_BUCKET/sigap/$ART" - \
            --endpoint-url "$R2_ENDPOINT" | sha256sum | cut -d' ' -f1)
          [ "$restored" = "$DIGEST" ] \
            || { echo "FAIL: restore left digest $restored, expected $DIGEST — control A3 would fail for an unrelated reason"; exit 1; }
          echo "ok: original object restored ($restored) for the remaining controls"

      - name: Negative control A2 — a URI naming another release must be refused
        run: |
          set -euo pipefail
          # PRECONDITION — see control A. An empty `$DIGEST`/`$API_ID`/`$ISOLATED_ID` makes
          # the helper refuse with 10 for an unrelated reason, which would read as a pass.
          for v in DIGEST API_ID ISOLATED_ID; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v is empty — the control would pass for the wrong reason"; exit 1; }
          done
          set +e
          out=$(ARCHIVE_URI="r2://$R2_BUCKET/sigap/sigap-pre-redesign-19990101T000000Z.tar.gz.age" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$EXPECTED_IDS" \
            bash scripts/ops/sigap-archive-restore.sh 2>&1)
          rc=$?
          set -e
          [ "$rc" -eq 10 ] || { echo "FAIL: wrong-release URI returned $rc, expected 10"; printf '%s\n' "$out"; exit 1; }
          # 10 is ALSO the code for a missing or malformed input, so the code alone does not
          # isolate the guard. Assert the message: only the basename comparison produces it.
          printf '%s' "$out" | grep -q 'ARCHIVE_URI names' \
            || { echo "FAIL: rc=10 for the WRONG reason — the wrong-release URI guard did not fire"; printf '%s\n' "$out"; exit 1; }
          echo "ok: wrong-release URI refused with rc=10 (basename guard)"

      - name: Negative control A3 — a malformed image ID must be refused as input
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          # A doubled prefix is the exact shape the earlier unconditional prefixing produced.
          #
          # PRECONDITION — see control A. This control depends on the OTHER inputs being
          # valid, because it must reach the EXPECT_IDS validation rather than fail earlier.
          for v in DIGEST API_ID ISOLATED_ID; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v is empty — the control would pass for the wrong reason"; exit 1; }
          done
          set +e
          out=$(ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="sha256:sha256:$EXPECTED_IDS" \
            bash scripts/ops/sigap-archive-restore.sh 2>&1)
          rc=$?
          set -e
          [ "$rc" -eq 10 ] || { echo "FAIL: doubled-prefix ID returned $rc, expected 10 (malformed input)"; printf '%s\n' "$out"; exit 1; }
          # The EXPECT_IDS validation runs AFTER load, so a message assertion here also
          # proves the whole fetch/decrypt/untar/load path executed before refusing.
          printf '%s' "$out" | grep -q 'EXPECT_IDS contains an invalid image ID' \
            || { echo "FAIL: rc=10 for the WRONG reason — the image-ID validator did not fire"; printf '%s\n' "$out"; exit 1; }
          echo "ok: doubled-prefix image ID refused with rc=10 (image-ID validator, reached after load)"

      - name: Negative control A4 — a loopback target without the opt-in must be refused
        run: |
          set -euo pipefail
          ART="sigap-pre-redesign-$STAMP.tar.gz.age"
          # PRECONDITION — see control A. The loopback guard fires BEFORE the engine and
          # digest validations, so 11 here cannot come from a missing input (those exit 10);
          # asserting the inputs exist makes that reasoning checkable rather than assumed.
          for v in DIGEST API_ID ISOLATED_ID; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v is empty — the control would pass for the wrong reason"; exit 1; }
          done
          set +e
          out=$(env -u SIGAP_ALLOW_LOOPBACK_TARGET \
          ARCHIVE_URI="r2://$R2_BUCKET/sigap/$ART" \
          R2_ENDPOINT="$R2_ENDPOINT" \
          ARCHIVE_KEY="$RUNNER_TEMP/throwaway.key" \
          STAMP="$STAMP" \
          EXPECT_DIGEST="$DIGEST" \
          ISOLATED_DOCKER_HOST="tcp://127.0.0.1:2375" \
          ALLOWED_ENGINE_ID="$ISOLATED_ID" \
          EXPECT_IDS="$EXPECTED_IDS" \
            bash scripts/ops/sigap-archive-restore.sh 2>&1)
          rc=$?
          set -e
          [ "$rc" -eq 11 ] || { echo "FAIL: loopback without opt-in returned $rc, expected 11"; printf '%s\n' "$out"; exit 1; }
          # 11 is also the code for an unreachable or non-allowlisted daemon, and for a
          # production-string match. Assert the message so only the loopback guard can
          # satisfy this control.
          printf '%s' "$out" | grep -q 'is a same-host endpoint' \
            || { echo "FAIL: rc=11 for the WRONG reason — the loopback guard did not fire"; printf '%s\n' "$out"; exit 1; }
          echo "ok: loopback target refused without SIGAP_ALLOW_LOOPBACK_TARGET=1 (loopback guard)"

      # ---------------------------------------------------------------------------------
      # GROUP B — CLOUDFLARE RETENTION-POLICY BEHAVIOUR. NOT COVERED BY THIS WORKFLOW.
      #
      # MinIO is S3-compatible; it does NOT implement R2 Bucket Lock. Nothing in this job
      # therefore says anything about whether an R2 lock rule prevents deletion or
      # overwriting. Group A proves object integrity and input/URI guards only.
      #
      # Verifying Bucket Lock requires the real service and a future, separately authorized
      # test: create a DISPOSABLE object under a throwaway prefix, apply a short retention
      # rule, and assert that deletion is refused for the window. That test must NEVER
      # attempt to delete or overwrite a real protected backup object — the attempt is
      # itself the destructive action the rule exists to prevent, and a bucket cannot be
      # emptied while lock rules are configured.
      # ---------------------------------------------------------------------------------

      - name: Cleanup
        if: always()
        run: |
          # The MinIO image is now BUILT rather than pulled, so it must be removed explicitly;
          # the runner's own cleanup reclaims pulled-image layers but not a locally built tag.
          docker rm -f sigap-minio sigap-restore-dind 2>/dev/null || true
          docker rmi -f sigap-minio:local sigap-r2-drill:local 2>/dev/null || true
          rm -f "$RUNNER_TEMP/throwaway.key" "$RUNNER_TEMP/artifact.age" 2>/dev/null || true
          echo "disposable endpoint, daemon, built images and throwaway key destroyed with the runner"
