name: CI

on:
  push:
    branches: [ main, design/ui-ux-overhaul ]
  pull_request:
    branches: [ main, design/ui-ux-overhaul ]

jobs:
  api:
    name: Go API Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://sigap_ci:sigap_ci_pass@localhost:5432/sigap_ci?sslmode=disable

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigap_ci
          POSTGRES_PASSWORD: sigap_ci_pass
          POSTGRES_DB: sigap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigap_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Pin to the version declared in go.mod (single source of truth) so CI
          # never silently drifts onto a newer Go release.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Apply database migrations
        run: |
          cd apps/api
          go run ./cmd/ci-migrate

      - name: Test API (with coverage)
        run: |
          set -o pipefail
          cd apps/api
          go mod download
          go test ./... -v -coverprofile=coverage.out 2>&1 | tee test_output.log
          echo "Total coverage:"
          go tool cover -func=coverage.out | tail -1

      - name: Verify DB-backed security tests executed
        run: |
          cd apps/api
          echo "=== DB-backed test execution proof ==="
          echo "Checking TestRBACResolver..."
          if ! grep -q "=== RUN.*TestRBACResolver" test_output.log; then
            echo "FAIL: TestRBACResolver tests did not run"
            exit 1
          fi
          echo "Checking TestFacilityScope..."
          if ! grep -q "=== RUN.*TestFacilityScope" test_output.log; then
            echo "FAIL: TestFacilityScope tests did not run"
            exit 1
          fi
          echo "Checking TestCheckIn..."
          if ! grep -q "=== RUN.*TestCheckIn" test_output.log; then
            echo "FAIL: TestCheckIn tests did not run"
            exit 1
          fi
          echo "Skip check (must be zero for DB-backed tests):"
          if grep -E -- "--- SKIP: *(TestRBACResolver|TestFacilityScope|TestCheckIn)" test_output.log; then
            echo "FAIL: DB-backed tests were skipped despite CI PostgreSQL service"
            exit 1
          fi
          echo "OK: all DB-backed tests executed with zero skips"

      - name: Coverage gate (deny-by-default router must stay covered)
        run: |
          cd apps/api
          go test ./internal/router/ -coverprofile=router.cov >/dev/null
          pct=$(go tool cover -func=router.cov | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          min=90
          echo "router coverage: ${pct}% (min ${min}%)"
          awk -v p="$pct" -v m="$min" 'BEGIN { exit (p+0 < m+0) ? 1 : 0 }' \
            || { echo "FAIL: router (security seam) coverage ${pct}% < ${min}%"; exit 1; }

  engine:
    name: Rust Engine Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (for tonic build.rs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        # actions-rs is archived/unmaintained; dtolnay/rust-toolchain is the
        # maintained replacement.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo Test + Clippy (engine)
        run: |
          cd apps/queue-engine
          cargo test
          cargo clippy -- -D warnings || true   # non-blocking for scaffold phase

  web:
    name: SvelteKit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: SvelteKit check
        run: pnpm --filter sigap-web run check

  ops-guards:
    name: Deployment Safety Guards
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED. The migration-inventory guard diffs
      # `origin/main..HEAD` and `6d7f940..HEAD`. At the default fetch-depth of 1
      # on a pull_request event, actions/checkout resolves the PR merge ref and
      # never creates refs/remotes/origin/main, so the guard's base ref is absent
      # and it fails — red on every PR while passing locally. The guard now names
      # the missing ref explicitly, and this step supplies the history it needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Host-free: no Docker daemon, no container, no production contact.
      # Proves the production env fails closed (missing/local SIGAP_ENV, bad
      # auth mode, dev-only flags) and that the deploy/rollback contract is
      # present. The compose-interpolation cases SKIP cleanly without a daemon.
      - name: Deployment safety guards
        run: |
          sh scripts/ops/test-preflight-production-env.sh
          sh scripts/ops/test-production-deploy-guards.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # The notification-contract, migration and classifier suites provision a
      # DISPOSABLE local PostgreSQL cluster with initdb/pg_ctl/psql, so the
      # server binaries must be present. They are installed here rather than
      # assumed, because that is what makes exit 2 a misconfiguration below
      # instead of a legitimate skip.
      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          # initdb refuses to run as root, so the suites must run as the runner
          # user; verify the binaries are reachable from PATH or the usual dir.
          ls -d /usr/lib/postgresql/*/bin/initdb

      # Each suite's exit codes are a contract: 0 = PASS, 1 = FAIL,
      # 2 = MISSING PREREQUISITE. Because this job INSTALLS the prerequisites,
      # a 2 here means the job is misconfigured and must fail rather than be
      # read as a clean skip — which is exactly why the guard is the `if` form
      # and not `suite; rc=$?; [ "$rc" -eq 2 ] || exit "$rc"`, whose guard is
      # dead code under `set -e` (see test-skip-exit-codes.sh, and the runbook
      # §12a which no longer documents the broken form).
      - name: Notification contract, migration, classifier and skip-code suites
        run: |
          set -o pipefail
          run_suite() {
            if "$@"; then
              echo "PASS: $*"
            else
              rc=$?
              echo "FAIL: $* (exit $rc)"
              exit "$rc"
            fi
          }
          run_suite sh scripts/ops/test-skip-exit-codes.sh
          run_suite sh scripts/ops/test-guard-shallow-clone.sh
          run_suite sh scripts/ops/test-db-classifier.sh
          run_suite sh scripts/ops/test-migration-0011.sh
          run_suite sh scripts/ops/test-notification-contract.sh

  security-go:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go API for known vulnerabilities
        run: |
          cd apps/api
          govulncheck ./...
        # govulncheck exits non-zero when vulnerabilities are found.
        # Keep this blocking so security issues cannot be merged silently.

  security-rust:
    name: Rust Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Scan Rust engine for known vulnerabilities
        run: |
          cd apps/queue-engine
          cargo audit || true   # non-blocking for scaffold phase; switch to blocking after stabilising deps

  security-secrets:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full git history to scan all commits

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks-action is free for public repos; private repos need a license.
        # Exits non-zero when leaks are found, keeping the gate blocking.
