name: CI

on:
  push:
    branches: [ main, design/ui-ux-overhaul ]
  pull_request:
    branches: [ main, design/ui-ux-overhaul ]

jobs:
  api:
    name: Go API Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://sigap_ci:sigap_ci_pass@localhost:5432/sigap_ci?sslmode=disable
      # Several DB-backed suites key off SIGAP_DATABASE_URL, not DATABASE_URL.
      # Leaving it unset made them silently skip in CI while the run stayed green.
      SIGAP_DATABASE_URL: postgresql://sigap_ci:sigap_ci_pass@localhost:5432/sigap_ci?sslmode=disable

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigap_ci
          POSTGRES_PASSWORD: sigap_ci_pass
          POSTGRES_DB: sigap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigap_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Pin to the version declared in go.mod (single source of truth) so CI
          # never silently drifts onto a newer Go release.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Apply database migrations
        run: |
          cd apps/api
          go run ./cmd/ci-migrate

      - name: Test API (with coverage)
        run: |
          set -o pipefail
          cd apps/api
          go mod download
          go test ./... -v -coverprofile=coverage.out 2>&1 | tee test_output.log
          echo "Total coverage:"
          go tool cover -func=coverage.out | tail -1

      - name: Verify DB-backed security tests executed
        run: |
          cd apps/api
          echo "=== DB-backed test execution proof ==="
          echo "Checking TestRBACResolver..."
          if ! grep -q "=== RUN.*TestRBACResolver" test_output.log; then
            echo "FAIL: TestRBACResolver tests did not run"
            exit 1
          fi
          echo "Checking TestFacilityScope..."
          if ! grep -q "=== RUN.*TestFacilityScope" test_output.log; then
            echo "FAIL: TestFacilityScope tests did not run"
            exit 1
          fi
          echo "Checking TestCheckIn..."
          if ! grep -q "=== RUN.*TestCheckIn" test_output.log; then
            echo "FAIL: TestCheckIn tests did not run"
            exit 1
          fi
          echo "Skip check (must be zero for DB-backed tests):"
          if grep -E -- "--- SKIP: *(TestRBACResolver|TestFacilityScope|TestCheckIn|TestListMyAppointments|TestListPublicFacilities|TestPatientStatusLookup|TestMigration0011_Transition|TestFreshMigrationChain|TestCrossFacility)" test_output.log; then
            echo "FAIL: DB-backed tests were skipped despite CI PostgreSQL service"
            exit 1
          fi
          echo "OK: all DB-backed tests executed with zero skips"

      - name: Coverage gate (deny-by-default router must stay covered)
        run: |
          cd apps/api
          go test ./internal/router/ -coverprofile=router.cov >/dev/null
          pct=$(go tool cover -func=router.cov | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          min=90
          echo "router coverage: ${pct}% (min ${min}%)"
          awk -v p="$pct" -v m="$min" 'BEGIN { exit (p+0 < m+0) ? 1 : 0 }' \
            || { echo "FAIL: router (security seam) coverage ${pct}% < ${min}%"; exit 1; }

  engine:
    name: Rust Engine Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (for tonic build.rs)
        run: |
          # A single-shot `apt-get update` reds this job whenever the runner image
          # momentarily fails to resolve azure.archive.ubuntu.com (transient DNS).
          # Retry the index refresh a bounded number of times, then fail loudly:
          # an unresolvable archive is an infrastructure fault, not a real signal.
          apt_update() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get update -qq; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "apt-get update failed (attempt ${attempt}/3); retrying in 10s" >&2
                sleep 10
              fi
            done
            echo "FAIL: apt-get update did not succeed after 3 attempts" >&2
            return 1
          }
          # tonic's build.rs only needs a protoc new enough for prost (>= 3.12).
          # If the image already ships one, skip the install and its network hop.
          protoc_usable() {
            command -v protoc >/dev/null 2>&1 || return 1
            local ver
            ver="$(protoc --version 2>/dev/null | awk 'NR == 1 { print $2 }')"
            [ -n "$ver" ] || return 1
            [ "$(printf '%s\n' "3.12.0" "$ver" | sort -V | head -n1)" = "3.12.0" ]
          }
          if protoc_usable; then
            echo "protoc $(protoc --version | awk '{ print $2 }') already on PATH; skipping install"
            exit 0
          fi
          apt_update
          sudo apt-get install -y protobuf-compiler
          which protoc

      - name: Setup Rust
        # actions-rs is archived/unmaintained; dtolnay/rust-toolchain is the
        # maintained replacement.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo Test + Clippy (engine)
        run: |
          cd apps/queue-engine
          cargo test
          cargo clippy -- -D warnings || true   # non-blocking for scaffold phase

  web:
    name: SvelteKit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: SvelteKit check
        run: pnpm --filter sigap-web run check

  # Real Better Auth / session lifecycle coverage. Without this job the CI run
  # can be green while every live auth assertion is skipped, which is exactly
  # the gap this workflow closes. REQUIRE_DB=1 makes any skip fatal.
  auth-integration:
    name: Better Auth Integration
    runs-on: ubuntu-latest
    env:
      SIGAP_DATABASE_URL: postgresql://sigap_ci:sigap_ci_pass@localhost:5432/sigap_ci?sslmode=disable
      DATABASE_URL: postgresql://sigap_ci:sigap_ci_pass@localhost:5432/sigap_ci?sslmode=disable
      BETTER_AUTH_SECRET: sigap-ci-only-not-a-production-secret-0001
      SIGAP_SESSION_SECURITY_REQUIRE_DB: '1'
      SIGAP_SESSION_LIFECYCLE_REQUIRE_DB: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigap_ci
          POSTGRES_PASSWORD: sigap_ci_pass
          POSTGRES_DB: sigap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigap_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply SIGAP migrations 0001-0014
        run: cd apps/api && go run ./cmd/ci-migrate

      - name: Provision Better Auth schema (official migration API)
        run: cd apps/web && node scripts/provision-auth-schema.mjs

      - name: Session security negatives (DB required)
        run: cd apps/web && node tests/session-security.test.js

      - name: Session lifecycle (DB required)
        run: cd apps/web && node tests/session-lifecycle.test.js

      - name: Auth config / registration / JWT claims (DB required)
        run: cd apps/web && node tests/auth-config-assertions.test.js

  attribution:
    name: Commit Attribution Check
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the check resolves a commit RANGE. A shallow
      # checkout cannot see the base commit, and the check reports that as exit 2
      # (missing prerequisite) rather than passing vacuously — see the note on
      # exit codes below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scans ONLY the commits this push or pull request adds, so the AI
      # co-author trailers already sitting in this repository's history can never
      # fail the job. The agent tools (Trae, Codebuff, Claude Code, OMP) stamp
      # those trailers into the message body when they create a commit;
      # `.githooks/commit-msg` strips them locally, and this is the gate that does
      # not depend on a developer having installed that hook.
      # See docs/operations/git-attribution.md.
      - name: Scan new commits for AI co-author trailers
        run: |
          # On pull_request, github.sha is the merge commit, so base..merge is
          # exactly the set of commits the PR adds (and needs no access to the
          # fork's refs). On push, github.event.before is the previous tip.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"
          # A new branch pushes with `before` set to forty zeros, which is not a
          # revision; scan just the pushed tip in that case.
          case "$base" in
            0000000000000000000000000000000000000000) base="";;
          esac
          if [ -n "$base" ]; then
            node scripts/check-attribution.mjs --range "$base..$head"
          else
            node scripts/check-attribution.mjs --range "$head^!"
          fi
        # Exit 1 is the gate: an AI trailer was found. Exit 2 means the range
        # could not be resolved, which the fetch-depth above exists to prevent —
        # it must fail loudly, never be read as a clean skip.

      # A trailer-only check cannot see WHO authored/committed the commit. PR #96
      # was built as sigap-ops <ops@local>, which the check above accepted. This
      # gate verifies both author and committer identity on new commits only.
      # Fork PRs stay in permissive mode so genuine external contributors are not
      # blocked merely for having a different email; strict mode (maintainer or
      # explicitly authorized automation only) applies on trusted branches.
      - name: Verify commit author/committer identity
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              mode=permissive
            else
              mode=auto
            fi
            branch="${{ github.event.pull_request.head.ref }}"
          else
            base="${{ github.event.before }}"
            mode=auto
            branch="${{ github.ref_name }}"
          fi
          head="${{ github.sha }}"
          case "$base" in
            0000000000000000000000000000000000000000) base="";;
          esac
          if [ -n "$base" ]; then
            node scripts/check-commit-identity.mjs --range "$base..$head" --mode "$mode" --branch "$branch"
          else
            node scripts/check-commit-identity.mjs --range "$head^!" --mode "$mode" --branch "$branch"
          fi

  ops-guards:
    name: Deployment Safety Guards
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED. The migration-inventory guard diffs
      # `origin/main..HEAD` and `d7705f09..HEAD`. At the default fetch-depth of 1
      # on a pull_request event, actions/checkout resolves the PR merge ref and
      # never creates refs/remotes/origin/main, so the guard's base ref is absent
      # and it fails — red on every PR while passing locally. The guard now names
      # the missing ref explicitly, and this step supplies the history it needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Host-free: no Docker daemon, no container, no production contact.
      # Proves the production env fails closed (missing/local SIGAP_ENV, bad
      # auth mode, dev-only flags) and that the deploy/rollback contract is
      # present. The compose-interpolation cases SKIP cleanly without a daemon.
      - name: Deployment safety guards
        run: |
          sh scripts/ops/test-preflight-production-env.sh
          sh scripts/ops/test-production-deploy-guards.sh
          # Static unit-file guards. The AUDIT-701 backup timer carried two OnCalendar
          # directives, which systemd ORs — so the database backup fired twice a day
          # while the unit's own description claimed one 03:00 run. These checks are
          # pure text inspection: no systemd, no host, no container, no network.
          sh scripts/ops/test-systemd-units.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # The notification-contract, migration and classifier suites provision a
      # DISPOSABLE local PostgreSQL cluster with initdb/pg_ctl/psql, so the
      # server binaries must be present. They are installed here rather than
      # assumed, because that is what makes exit 2 a misconfiguration below
      # instead of a legitimate skip.
      - name: Install PostgreSQL server binaries
        run: |
          # Same bounded retry as the protoc step: a transient DNS failure while
          # refreshing the index must not red the job, and must not be mistaken
          # for the "missing prerequisite" exit code the suites below contract on.
          apt_update() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get update -qq; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "apt-get update failed (attempt ${attempt}/3); retrying in 10s" >&2
                sleep 10
              fi
            done
            echo "FAIL: apt-get update did not succeed after 3 attempts" >&2
            return 1
          }
          apt_update
          sudo apt-get install -y postgresql
          # initdb refuses to run as root, so the suites must run as the runner
          # user; verify the binaries are reachable from PATH or the usual dir.
          ls -d /usr/lib/postgresql/*/bin/initdb

      # Each suite's exit codes are a contract: 0 = PASS, 1 = FAIL,
      # 2 = MISSING PREREQUISITE. Because this job INSTALLS the prerequisites,
      # a 2 here means the job is misconfigured and must fail rather than be
      # read as a clean skip — which is exactly why the guard is the `if` form
      # and not `suite; rc=$?; [ "$rc" -eq 2 ] || exit "$rc"`, whose guard is
      # dead code under `set -e` (see test-skip-exit-codes.sh, and the runbook
      # §12a which no longer documents the broken form).
      - name: Notification contract, migration, classifier and skip-code suites
        run: |
          set -o pipefail
          run_suite() {
            if "$@"; then
              echo "PASS: $*"
            else
              rc=$?
              echo "FAIL: $* (exit $rc)"
              exit "$rc"
            fi
          }
          run_suite sh scripts/ops/test-skip-exit-codes.sh
          run_suite sh scripts/ops/test-guard-shallow-clone.sh
          run_suite sh scripts/ops/test-db-classifier.sh
          run_suite sh scripts/ops/test-migration-0011.sh
          run_suite sh scripts/ops/test-notification-contract.sh
          # The 0011 rollback-safety pre-flight. J11 is no longer UNKNOWN: the older
          # release CAN attempt a write the strengthened constraint refuses (a facility
          # whose short_code renders a separator-run queue number), and that failure is
          # swallowed by the fire-and-forget enqueue, so the notification is lost
          # silently. This suite proves the read-only detector is not vacuous.
          run_suite sh scripts/ops/test-preflight-0011-rollback-safety.sh

      # The Bucket Lock retention drill's value is entirely in its assertions, and
      # every one of them is a negative: a deletion that must be refused, a refusal
      # that must name the retention reason, a production rule that must survive.
      # This runs it against a stub executor so those paths stay tested WITHOUT
      # touching a real bucket. pwsh is present on ubuntu-latest; a 2 here would
      # mean the runner lost it, which is a misconfiguration, not a skip.
      - name: Bucket Lock drill assertions (stub executor)
        run: |
          if sh scripts/ops/test-bucket-lock-drill.sh; then
            echo "PASS: bucket-lock drill assertions"
          else
            rc=$?
            echo "FAIL: bucket-lock drill assertions (exit $rc)"
            exit "$rc"
          fi

  security-go:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go API for known vulnerabilities
        run: |
          cd apps/api
          govulncheck ./...
        # govulncheck exits non-zero when vulnerabilities are found.
        # Keep this blocking so security issues cannot be merged silently.

  security-rust:
    name: Rust Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Scan Rust engine for known vulnerabilities
        run: |
          cd apps/queue-engine
          cargo audit
        # Blocking. Narrowly scoped, documented exceptions live in apps/queue-engine/.cargo/audit.toml.
        # Any new/changed finding fails the job; remove or tighten exceptions only with evidence.

  security-secrets:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full git history to scan all commits

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commit-scoped policy for the 15 fully classified historical false
          # positives. New findings in new commits are still reported.
          GITLEAKS_CONFIG: .gitleaks.toml
        # gitleaks-action is free for public repos; private repos need a license.
        # Exits non-zero when leaks are found, keeping the gate blocking.
