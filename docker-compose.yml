# docker-compose.yml
# 1-Click Deploy for Sigap (Go API + Rust Engine + SvelteKit + Postgres)
# Run with: docker compose up -d --build
#
# After start, apply DB migration (one time):
#   docker compose exec -T postgres psql -U sigap -d sigap -f /docker-entrypoint-initdb.d/0001_init.sql || \
#   docker cp packages/db/migrations/0001_init.sql sigap-postgres-1:/tmp/ && \
#   docker compose exec postgres psql -U sigap -d sigap -f /tmp/0001_init.sql
#
# Then open http://localhost:3005

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy from .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-sigap}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: mount migration for easy init
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigap -d sigap"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rust-engine:
    build:
      context: .
      dockerfile: apps/queue-engine/Dockerfile
    container_name: sigap-rust-engine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sigap}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sigap-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sigap}
      SIGAP_ENGINE_ADDR: rust-engine:50051
      SIGAP_API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      rust-engine:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sigap-web
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: http://localhost:3005
      # Internal Docker service URL for SvelteKit +server.ts proxies (resolves to Go API inside network)
      SIGAP_API_INTERNAL: http://api:8080
      # PUBLIC_SIGAP_API_BASE kept for reference (client uses relative paths via proxy now)
      PUBLIC_SIGAP_API_BASE: http://localhost:8080
    depends_on:
      - api
    ports:
      - "3005:3000"
    restart: unless-stopped

volumes:
  pgdata:
