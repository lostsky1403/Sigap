# docker-compose.yml
# 1-Click Deploy for Sigap (Go API + Rust Engine + SvelteKit + Postgres)
# Run with: docker compose up -d --build
#
# After start, apply DB migration (one time):
#   docker compose exec -T postgres psql -U sigap -d sigap -f /docker-entrypoint-initdb.d/0001_init.sql || \
#   docker cp packages/db/migrations/0001_init.sql sigap-postgres-1:/tmp/ && \
#   docker compose exec postgres psql -U sigap -d sigap -f /tmp/0001_init.sql
#
# Then open http://localhost:3005

services:
  # One-shot init: generate a self-signed TLS cert for Postgres into a shared
  # volume, fix ownership/permissions (postgres runs as uid 70), then exit.
  # Postgres waits for this to complete so `ssl=on` always has a readable key.
  # Dev only: self-signed cert means clients use sslmode=require (encrypt, no CA
  # verification). Production must mount a CA-issued cert and use verify-full.
  pg-cert-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /certs/server.key ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -new -x509 -days 365 -nodes \
            -out /certs/server.crt -keyout /certs/server.key \
            -subj "/CN=sigap-postgres"
        fi
        chmod 600 /certs/server.key
        chmod 644 /certs/server.crt
        chown 70:70 /certs/server.key /certs/server.crt
    volumes:
      - pgcerts:/certs
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: sigap-postgres
    # Serve TLS using the cert generated by pg-cert-init.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy from .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-sigap}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: mount migration for easy init
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
      - pgcerts:/certs:ro
    depends_on:
      pg-cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigap -d sigap"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rust-engine:
    build:
      context: .
      dockerfile: apps/queue-engine/Dockerfile
    container_name: sigap-rust-engine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sigap}?sslmode=require
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sigap-api
    environment:
      # Go API talks to the Rust engine over gRPC and does not open this URL today;
      # kept in sync (sslmode=require) so it is correct if the API ever connects.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sigap}?sslmode=require
      SIGAP_ENGINE_ADDR: rust-engine:50051
      SIGAP_API_PORT: 8080
      # Required: auth mode must be explicitly set (dev, jwt, or disabled).
      # Compose fails fast if this is missing — prevents silent locked-but-running API.
      SIGAP_AUTH_MODE: ${SIGAP_AUTH_MODE:?set SIGAP_AUTH_MODE in .env (dev, jwt, or disabled)}
      # JWT/OIDC validation (required in jwt mode; fail-closed boot when absent).
      SIGAP_AUTH_ISSUER: ${SIGAP_AUTH_ISSUER:-}
      SIGAP_AUTH_AUDIENCE: ${SIGAP_AUTH_AUDIENCE:-}
      SIGAP_AUTH_JWKS_URL: ${SIGAP_AUTH_JWKS_URL:-}
      # Server-side RBAC + audit: jwt mode resolves permissions from the DB
      # via app_users.subject; without a pool it fails closed (zero permissions).
      SIGAP_DATABASE_URL: postgresql://${POSTGRES_USER:-sigap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sigap}?sslmode=require
      SIGAP_AUTO_MIGRATE: ${SIGAP_AUTO_MIGRATE:-}
      # Environment marker. Drives the API's fail-fast guards: dev-only flags
      # are rejected outside "local", and non-local requires TLS confirmation.
      SIGAP_ENV: ${SIGAP_ENV:-local}
      # Confirms TLS is terminated by the edge proxy in front of the API.
      # Required to be "true" when SIGAP_ENV is staging/production.
      SIGAP_TLS_TERMINATED: ${SIGAP_TLS_TERMINATED:-false}
      # CORS allow-list for browser calls from the web origin. Only the exact
      # configured origin is allowed outside loopback mode.
      SIGAP_WEB_ORIGIN: ${SIGAP_WEB_ORIGIN:-http://localhost:3005}
      # Number of trusted reverse-proxy hops in front of the API. The edge
      # (Traefik) is one hop; requests reach the API through the SvelteKit
      # proxy on top of that, so the count is explicit rather than assumed.
      SIGAP_TRUSTED_PROXIES: ${SIGAP_TRUSTED_PROXIES:-2}
    depends_on:
      postgres:
        condition: service_healthy
      rust-engine:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sigap-web
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Public origin the browser sees. Drives SvelteKit request-origin/CSRF
      # checks and absolute-URL generation. Never hardcoded: production gets
      # the real https origin from the environment. The localhost default
      # keeps `docker compose up` working out of the box for development.
      ORIGIN: ${SIGAP_WEB_ORIGIN:-http://localhost:3005}
      # Environment marker consumed by the web app's production guards
      # (e.g. SIGAP_DEV_IDENTITY is rejected when not "local").
      SIGAP_ENV: ${SIGAP_ENV:-local}
      # Confirms a TLS-terminating reverse proxy sits in front. The web app
      # listens on plain HTTP and relies on this to emit secure cookies/HSTS.
      SIGAP_TLS_TERMINATED: ${SIGAP_TLS_TERMINATED:-false}
      # Internal Docker service URL for SvelteKit +server.ts proxies (resolves to Go API inside network)
      SIGAP_API_INTERNAL: http://api:8080
      # PUBLIC_SIGAP_API_BASE kept for reference (client uses relative paths via proxy now)
      PUBLIC_SIGAP_API_BASE: ${PUBLIC_SIGAP_API_BASE:-http://localhost:8080}
      # Supabase Auth (server-side session; publishable values only, never the service-role key)
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      - api
    ports:
      - "3005:3000"
    # Edge routing labels. The shared host edge is Traefik (v2.11) which reads
    # Docker labels via its docker provider (exposedbydefault=false), so an
    # explicit enable + router + TLS resolver is required for this service to
    # be published on 80/443. The router only matches this exact hostname;
    # unrelated applications on the same edge are untouched.
    # Disabled by default (ENABLE_EDGE_ROUTING) because Traefik can only reach
    # this container once it shares the edge's Docker network — see the
    # docker-compose.prod-edge.yml overlay, which attaches that network.
    labels:
      traefik.enable: ${ENABLE_EDGE_ROUTING:-false}
      traefik.docker.network: ${EDGE_NETWORK:-traefik}
      # HTTP entrypoint: redirect to HTTPS (global entrypoint redirect already
      # exists, this makes it explicit + lets ACME HTTP-01 complete).
      traefik.http.routers.sigap-web.entrypoints: ${EDGE_ENTRYPOINT_WEB:-web}
      traefik.http.routers.sigap-web.rule: Host(`${SIGAP_PUBLIC_HOST:-sigap.chaerulchalik.web.id}`)
      traefik.http.routers.sigap-web.middlewares: sigap-web-redirect-https
      traefik.http.routers.sigap-web.service: sigap-web
      # HTTPS entrypoint: TLS terminated by the edge, certificate obtained
      # automatically through the existing ACME resolver.
      traefik.http.routers.sigap-web-secure.entrypoints: ${EDGE_ENTRYPOINT_SECURE:-websecure}
      traefik.http.routers.sigap-web-secure.rule: Host(`${SIGAP_PUBLIC_HOST:-sigap.chaerulchalik.web.id}`)
      traefik.http.routers.sigap-web-secure.service: sigap-web
      traefik.http.routers.sigap-web-secure.tls: "true"
      traefik.http.routers.sigap-web-secure.tls.certresolver: ${EDGE_CERT_RESOLVER:-main-resolver}
      traefik.http.middlewares.sigap-web-redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.sigap-web-redirect-https.redirectscheme.permanent: "true"
      # Container port for the edge to proxy to.
      traefik.http.services.sigap-web.loadbalancer.server.port: "3000"
    restart: unless-stopped

volumes:
  pgdata:
  pgcerts:
